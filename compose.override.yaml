services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  backend:
    image: go-todo-backend:development
    build:
      target: development
    init: true

    environment:
      LOG_LEVEL: ${LOG_LEVEL:-debug}

    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

    volumes:
      - ./backend:/app

  frontend:
    image: go-todo-frontend:development
    build:
      target: development
    init: true

    environment:
      API_PROXY_TARGET: http://backend:8080

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"

    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
